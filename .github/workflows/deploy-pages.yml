name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/language-en.json'
      - 'src/locales/**'
      - 'src/wallet-new/language-en.json'
      - 'src/wallet-new/locales/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy folder
        run: |
          mkdir -p _site

          # English master
          cp src/language-en.json _site/language-en.json

          # All translated locale files — flattened from src/locales/
          if [ -d src/locales ]; then
            cp src/locales/language-*.json _site/ 2>/dev/null || true
          fi

          # rehive-wallet-new is a SEPARATE family under its own prefix. Its namespace names
          # collide with the legacy apps' (`common.select` is a string there, an object here), so
          # the two must never be served from the same file or the same directory.
          if [ -d src/wallet-new ]; then
            mkdir -p _site/wallet-new
            cp src/wallet-new/language-en.json _site/wallet-new/ 2>/dev/null || true
            cp src/wallet-new/locales/language-*.json _site/wallet-new/ 2>/dev/null || true
            node -e "
              const fs = require('fs');
              const dir = '_site/wallet-new';
              const files = fs.readdirSync(dir).filter(f => f.startsWith('language-') && f.endsWith('.json'));
              const locales = files.map(f => f.replace('language-', '').replace('.json', ''));
              fs.writeFileSync(dir + '/index.json', JSON.stringify({ locales }, null, 2));
              console.log('wallet-new locales deployed:', locales.join(', ') || '(none)');
            "
          fi

          # index.json — lists all available locale codes for easy discovery
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('_site').filter(f => f.startsWith('language-') && f.endsWith('.json'));
            const locales = files.map(f => f.replace('language-', '').replace('.json', ''));
            fs.writeFileSync('_site/index.json', JSON.stringify({ locales }, null, 2));
            console.log('Locales deployed:', locales.join(', '));
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
